version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kairobarber-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairobarber
      POSTGRES_PASSWORD: kairobarber_dev
      POSTGRES_DB: kairobarber
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kairobarber -d kairobarber']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kairobarber-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
